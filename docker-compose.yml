name: "brinjel"


x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"


services:
  brinjel:
    image: "docker.io/azariasb/brinjel:latest"
    container_name: brinjel
    <<: *lockdown
    restart: no
    ports:
      - "4000:4000"
    volumes:
    - "postgres.run:/var/run/postgresql"
    - "brinjel.uploads:/app/uploads"
    - "brinjel.exports:/app/exports"
    networks:
      brinjel:
    environment:
      - BRINJEL_DATABASE_USER=postgres
      - BRINJEL_DATABASE_NAME=postgres
      - NAVIGATION_STATE_PATH=/
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - BRINJEL_UPLOADS_DIR=/app/uploads
      - BRINJEL_EXPORTS_DIR=/app/exports
      - PHX_HOST=127.0.0.1
    depends_on:
      database:
        condition: service_healthy

  database:
    image: "docker.io/11notes/postgres:18"
    container_name: postgres
    <<: *lockdown
    environment:
      TZ: "Europe/Paris"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_BACKUP_SCHEDULE: "0 3 * * *"
      POSTGRES_BACKUP_RETENTION: 5
    expose:
      - "5432"
    networks:
      brinjel:
    volumes:
      - "postgres.etc:/postgres/etc"
      - "postgres.var:/postgres/var"
      - "postgres.backup:/postgres/backup"
      - "postgres.run:/postgres/run"
    tmpfs:
      - "/postgres/log:uid=1000,gid=1000"
    restart: "always"



volumes:
  brinjel.uploads:
  brinjel.exports:
  postgres.etc:
  postgres.var:
  postgres.backup:
  postgres.run:

networks:
  brinjel: