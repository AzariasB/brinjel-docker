---
name: Build and push bringel to docker hub

env:
  IMAGE_NAME: azariasb/brinjel
  PLATFORMS: linux/amd64,linux/arm64
on:
    push:
    pull_request:

jobs:
  deploy:
    name: Build and push docker image
    if: "github.event_name == 'pull_request' || !contains(github.event.commits[0].message, '[skip ci]')"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Make sure docker build works
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: azariasb/brinjel:build-${{ github.sha }}